name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant — cancel it
# rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Single source of truth, shared with local nvm/fnm.
          node-version-file: .node-version
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if the
      # lockfile and package.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      # Catches the build-only failures that typecheck cannot see, because
      # tsconfig.build.json excludes tests/ and so resolves types differently.
      - name: Build
        run: npm run build

      - name: Upload coverage report
        # Still useful when the tests above failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
